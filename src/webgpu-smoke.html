<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Compute Smoke Test</title>
</head>
<body>
    <pre id="result">running</pre>
    <script type="module">
        import { runWebGPUComputeSmokeTest } from './javascript/Computes/WebGPU/WebGPUComputeSmokeTest.js'

        const result = document.getElementById('result')

        try
        {
            const value = await runWebGPUComputeSmokeTest()
            result.textContent = JSON.stringify(value, null, 2)
            result.dataset.passed = String(value.passed)
        }
        catch (error)
        {
            result.textContent = JSON.stringify(
                {
                    passed: false,
                    message: error?.message ?? String(error),
                    stack: error?.stack ?? null,
                },
                null,
                2,
            )
            result.dataset.passed = 'false'
        }
    </script>
</body>
</html>
